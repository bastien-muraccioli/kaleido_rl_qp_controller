---
Managed: false
StepByStep: true
IdleKeepState: false

StatesLibraries:
  - "@MC_STATES_DEFAULT_RUNTIME_INSTALL_PREFIX@"
  - "@MC_STATES_RUNTIME_INSTALL_PREFIX@"
StatesFiles:
  - "@MC_STATES_DEFAULT_RUNTIME_INSTALL_PREFIX@/data"
  - "@MC_STATES_RUNTIME_INSTALL_PREFIX@/data"
VerboseStateFactory: false

robots:
  ground:
    module: env/ground

robot:
  base_body: base_link
  observation_source: realRobot

collisions:
  - type: collision
    useMinimal: true

# Constraint examples. Keep only constraints supported by your robot and application.
# constraints:
#   - type: contact
#     contactType: acceleration
#   - type: compoundJoint

ObserverPipelines:
  name: "ObserverPipeline"
  gui: true
  log: true
  observers:
    - type: Encoder
      velocity: encoderFiniteDifferences
      log:
        position: true
        velocity: true
        torque: true
    - type: MCWaiko
      required: true
      update: true
      leggedOdometry:
        odometryType: Flat # 6D
      filterGains:
        initAlpha: 4
        initRho: 2
        initBeta: 4
        initGamma: 1
        initMu: 1
        finalAlpha: 4
        finalRho: 1
        finalBeta: 4
        finalGamma: 1
        finalMu: 1
      contacts:
        contactsDetection: Surfaces
        surfacesForContactDetection: [RightFootCenter, LeftFootCenter]
    # - type: BodySensor
    #   required: true
    #   update: false
    #   bodySensor: FloatingBase
    #   updateAcc: true
    - type: ExternalForcesObserver
      is_active: false
      estimation_method: MomentumObserver # ForceSensorBased
      torque_source_type: MotorTorqueMeasurement # MotorTorqueMeasurement CommandedTorque
      use_forces_from_ft_sensors: false
      residual_gain: 100.0

states: {}
transitions:
  - [KaleidoRLQPController_Initial, OK, KaleidoRLQPController_Initial, Strict]
init: KaleidoRLQPController_Initial

policies_root: "@CMAKE_CURRENT_SOURCE_DIR@/policies"
default_policy: kaleido
