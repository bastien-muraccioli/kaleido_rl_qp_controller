# Kaleido walking policy observations (mjlab training order).

training_convention: mjlab

# Optional. Defines the order in which to handle all observations history. Defaults to true.
history_order_newest_first: false  # mjlab CircularBuffer is oldest -> newest

# Policy-wide defaults (each observation can override them in its parameters)
observation_source: realRobot  # realRobot = measured state, robot = QP-integrated control state
history: 5

observations:

  - type: base_lin_vel
    parameters:
      # No 'body': defaults to robot.base_body (BODY). 'body: base' is no longer a keyword.
      # Velocity of the base from the observer estimate; the IMU has no linear velocity.
      scale: [1.0, 1.0, 1.0]

  - type: base_ang_vel
    parameters:
      # No 'body': defaults to robot.base_body, expressed in the base frame as mjlab root_link_ang_vel_b
      scale: [1.0, 1.0, 1.0]

  - type: projected_gravity
    parameters:
      scale: [1.0, 1.0, 1.0]

  - type: joint_pos
    name: joint_positions
    parameters:
      joints: all
      relative_to_default_pose: true
      scale: 1.0
      # Diagnostic: uncomment to feed the policy the QP-integrated joint state instead of the measured one
      # observation_source: robot

  - type: joint_vel
    name: joint_velocities
    parameters:
      joints: all
      relative_to_default_velocity: true
      scale: 1.0
      # observation_source: robot

  - type: last_action
    name: actions  # ONNX observation_names term; also silences the order-check warning
    parameters:
      joints: all
      scale: 1.0

  - type: command
    parameters:
      size: 3
      scale: [1.0, 1.0, 1.0]
